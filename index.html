<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流浪猫的避难所</title>
<meta name="description" content="流浪猫的避难所 —— 一个在代码与像素之间流浪的人，记录游戏设计、原创角色与深夜碎碎念。">
<meta name="theme-color" content="#0a0a08">
<meta property="og:title" content="流浪猫的避难所">
<meta property="og:description" content="代码、像素与深夜碎碎念的避难所。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=DM+Mono:wght@300;400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a08;--surface:#141412;--surface2:#1c1c18;
  --accent:#d4a24e;--accent-dim:rgba(212,162,78,.6);
  --green:#7a9e7e;--purple:#8b7ac4;--rose:#c47a8b;
  --text-p:#f0ece4;--text-m:#6b6760;--text-b:#b0a99a;
  --border:rgba(107,103,96,.15);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text-b);font-family:'DM Mono',monospace;font-weight:300;font-size:14px;line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.03;pointer-events:none;z-index:9999}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:var(--bg)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:24px 48px;mix-blend-mode:difference}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--text-p);letter-spacing:.02em;cursor:pointer;user-select:none}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-link{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-m);position:relative;padding-bottom:2px;transition:color .3s}
.nav-link:hover,.nav-link.active{color:var(--accent)}
.nav-link.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--accent)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.nav-hamburger span{width:22px;height:1.5px;background:var(--text-p);transition:.3s}

/* MAIN */
main{padding-top:88px;min-height:100vh}
.page{display:none;padding:48px 48px 0;max-width:1200px;margin:0 auto}
.page.active{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:baseline;gap:16px;margin-bottom:48px}
.sec-num{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--accent);font-weight:600}
.sec-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:var(--text-m)}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(107,103,96,.3),transparent)}

/* HOME FEED */
.feed-hero{margin-bottom:64px}
.feed-hero h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(36px,5vw,64px);color:var(--text-p);line-height:1.1;margin-bottom:12px}
.feed-hero h1 em{font-style:italic;color:var(--accent)}
.feed-hero p{color:var(--text-m);font-size:13px;max-width:500px}
.feed-list{border-top:1px solid var(--border)}
.feed-item{display:grid;grid-template-columns:100px 80px 1fr auto;gap:24px;align-items:center;padding:24px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:padding-left .3s ease}
.feed-item:hover{padding-left:12px}
.feed-item-date{font-size:12px;color:var(--text-m);font-variant-numeric:tabular-nums}
.feed-type{font-size:10px;text-transform:uppercase;letter-spacing:.15em;padding:3px 10px;border:1px solid;text-align:center;white-space:nowrap}
.feed-type[data-type="article"]{color:var(--accent);border-color:rgba(212,162,78,.4)}
.feed-type[data-type="rant"]{color:var(--green);border-color:rgba(122,158,126,.4)}
.feed-type[data-type="image"]{color:var(--purple);border-color:rgba(139,122,196,.4)}
.feed-item-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text-p);transition:color .3s}
.feed-item:hover .feed-item-title{color:var(--accent)}
.feed-item-arrow{color:var(--text-m);font-size:18px;transition:transform .3s,color .3s}
.feed-item:hover .feed-item-arrow{transform:translateX(4px);color:var(--accent)}

/* TOGGLE */
.view-toggle{display:flex;gap:0;margin-bottom:36px}
.toggle-btn{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.15em;padding:10px 24px;background:transparent;border:1px solid var(--border);color:var(--text-m);cursor:pointer;transition:.3s}
.toggle-btn:first-child{border-right:none}
.toggle-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ARTICLES */
.articles-timeline{position:relative}
.articles-year{margin-bottom:48px}
.year-label{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:rgba(240,236,228,.08);margin-bottom:24px;user-select:none}
.year-month{margin-bottom:28px}
.month-label{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent-dim);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid rgba(212,162,78,.1)}
.month-item{display:flex;align-items:baseline;gap:16px;padding:10px 0;cursor:pointer;transition:padding-left .3s}
.month-item:hover{padding-left:12px}
.month-item-day{font-size:12px;color:var(--text-m);min-width:28px;font-variant-numeric:tabular-nums}
.month-item-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text-p);transition:color .3s}
.month-item:hover .month-item-title{color:var(--accent)}
.articles-collections{}
.collection-card{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);margin-bottom:24px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.collection-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.collection-cover{min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
.collection-count{position:absolute;bottom:16px;right:16px;font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:rgba(240,236,228,.08)}
.collection-body{padding:28px;display:flex;flex-direction:column;justify-content:center}
.collection-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--text-p);margin-bottom:8px}
.collection-desc{font-size:13px;color:var(--text-m);margin-bottom:16px}
.collection-items{list-style:none;display:flex;flex-direction:column;gap:6px}
.collection-items li{font-size:13px;color:var(--text-b);padding-left:14px;position:relative}
.collection-items li::before{content:'';position:absolute;left:0;top:50%;width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* IMAGES */
.img-waterfall{column-count:4;column-gap:16px}
.img-card{break-inside:avoid;margin-bottom:16px;position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--border)}
.img-card-inner{position:relative;overflow:hidden}
.img-placeholder{width:100%;display:block}
.img-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,10,8,.85) 100%);opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:16px}
.img-card:hover .img-card-overlay{opacity:1}
.img-card-caption{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text-p)}
.album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.album-card{border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.album-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(0,0,0,.3)}
.album-cover{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative}
.album-count-tag{position:absolute;top:16px;right:16px;font-size:10px;text-transform:uppercase;letter-spacing:.15em;padding:4px 10px;background:rgba(10,10,8,.7);border:1px solid var(--border);color:var(--text-m)}
.album-info{padding:20px}
.album-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text-p);margin-bottom:4px}
.album-desc{font-size:12px;color:var(--text-m)}

/* ABOUT */
.about-hero{text-align:center;padding:60px 0 80px;position:relative}
.about-name{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(48px,8vw,120px);color:var(--text-p);line-height:.95;margin-bottom:16px}
.about-name em{font-style:italic;color:var(--accent)}
.about-aka{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-m);margin-bottom:48px}
.about-poem{max-width:480px;margin:0 auto;font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--text-b);line-height:1.8;position:relative;padding:32px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.about-poem::before{content:'"';position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:'Cormorant Garamond',serif;font-size:64px;color:rgba(212,162,78,.15);line-height:1}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:80px 0;align-items:start}
.about-bio h3{font-family:'Syne',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:20px}
.about-bio p{margin-bottom:20px;color:var(--text-b);font-size:14px}
.about-bio p:first-of-type::first-letter{font-family:'Cormorant Garamond',serif;font-size:46px;float:left;line-height:1;margin-right:8px;margin-top:6px;color:var(--accent)}
.about-side{}
.about-stat{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border)}
.about-stat-num{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--text-p)}
.about-stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-m);text-align:right;align-self:center}
.about-quote{text-align:center;padding:80px 0;font-family:'Cormorant Garamond',serif;font-size:clamp(20px,3vw,32px);font-style:italic;color:var(--text-m);max-width:600px;margin:0 auto;line-height:1.6}

/* DETAIL */
.detail-back{display:inline-flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-m);margin-bottom:40px;cursor:pointer;transition:color .3s}
.detail-back:hover{color:var(--accent)}
.detail-header{margin-bottom:48px;max-width:700px}
.detail-meta{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.detail-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,4vw,48px);color:var(--text-p);line-height:1.2}
.detail-body{max-width:700px;padding-bottom:80px}
.detail-body p{margin-bottom:20px;color:var(--text-b);line-height:1.9}
.detail-body h1,.detail-body h2,.detail-body h3{font-family:'Syne',sans-serif;color:var(--text-p);margin:32px 0 16px}
.detail-body h1{font-size:24px} .detail-body h2{font-size:20px} .detail-body h3{font-size:16px}
.detail-body strong{color:var(--text-p);font-weight:400}
.detail-body em{color:var(--accent)}
.detail-body code{background:var(--surface);padding:2px 6px;font-size:13px;color:var(--accent)}
.detail-body ul{margin:16px 0;padding-left:20px}
.detail-body li{margin-bottom:8px;color:var(--text-b)}
.detail-body li::marker{color:var(--accent)}
.detail-body hr{border:none;border-top:1px solid var(--border);margin:32px 0}
.detail-body a{color:var(--accent);border-bottom:1px solid rgba(212,162,78,.3);transition:border-color .3s}
.detail-body a:hover{border-color:var(--accent)}
.detail-body blockquote{border-left:2px solid var(--accent);padding-left:20px;margin:24px 0;color:var(--text-m);font-style:italic}
.detail-body .detail-img{margin:24px 0;border:1px solid var(--border)}

/* ADMIN */
.admin-gate{text-align:center;padding:120px 0}
.admin-gate h2{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--text-p);margin-bottom:24px}
.admin-gate input{background:var(--surface);border:1px solid var(--border);color:var(--text-p);font-family:'DM Mono',monospace;font-size:14px;padding:12px 20px;width:300px;text-align:center;outline:none;transition:border-color .3s}
.admin-gate input:focus{border-color:var(--accent)}
.admin-gate button{display:block;margin:20px auto 0;font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.15em;padding:12px 32px;background:var(--accent);color:var(--bg);border:none;cursor:pointer;transition:.3s}
.admin-gate button:hover{letter-spacing:.2em}
.admin-gate .gate-error{color:var(--rose);font-size:12px;margin-top:12px;min-height:18px}
.admin-panel{display:none}
.admin-panel.show{display:block}
.admin-tabs{display:flex;gap:0;margin-bottom:32px}
.admin-tab{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:10px 24px;background:transparent;border:1px solid var(--border);color:var(--text-m);cursor:pointer;transition:.3s}
.admin-tab:first-child{border-right:none}
.admin-tab.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.admin-tab-content{display:none}.admin-tab-content.active{display:block}
.admin-form{max-width:600px}
.form-row{margin-bottom:24px}
.form-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-m);margin-bottom:8px}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text-p);font-family:'DM Mono',monospace;font-size:14px;padding:12px 16px;outline:none;transition:border-color .3s}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-select{appearance:none;cursor:pointer}
.form-textarea{min-height:200px;resize:vertical;line-height:1.8}
.form-actions{display:flex;gap:16px;margin-top:32px}
.btn{font-family:'DM Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;padding:12px 32px;border:none;cursor:pointer;transition:.3s}
.btn-primary{background:var(--accent);color:var(--bg)}.btn-primary:hover{letter-spacing:.18em}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text-m)}.btn-secondary:hover{border-color:var(--text-m)}
.btn-danger{background:transparent;border:1px solid var(--rose);color:var(--rose);font-size:11px;padding:6px 14px}.btn-danger:hover{background:var(--rose);color:var(--bg)}
.admin-post-list{list-style:none}
.admin-post-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}
.admin-post-info{display:flex;gap:16px;align-items:center}
.admin-post-title{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text-p)}
.admin-post-date{font-size:12px;color:var(--text-m)}
.admin-success{color:var(--green);font-size:13px;margin-top:12px;min-height:20px}
.admin-settings{max-width:500px}
.admin-settings .form-row{margin-bottom:20px}
.admin-settings-note{font-size:12px;color:var(--text-m);margin-bottom:24px;line-height:1.7}

/* FOOTER */
.site-footer{border-top:1px solid var(--border);margin-top:80px;padding:48px 48px 32px;max-width:1200px;margin-left:auto;margin-right:auto}
.footer-friends{margin-bottom:40px}
.footer-friends-title{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--text-m);margin-bottom:20px}
.footer-friends-grid{display:flex;flex-wrap:wrap;gap:16px}
.footer-friend{display:flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid var(--border);transition:.3s}
.footer-friend:hover{border-color:var(--accent)}
.footer-friend-avatar{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-m);flex-shrink:0}
.footer-friend-name{font-size:13px;color:var(--text-b)}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;padding-top:24px;border-top:1px solid var(--border)}
.footer-copy{font-size:11px;color:var(--text-m);letter-spacing:.05em}
.footer-admin{font-size:11px;color:var(--text-m);letter-spacing:.05em;cursor:pointer;transition:color .3s;opacity:.4}
.footer-admin:hover{color:var(--accent);opacity:1}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:pointer}
.lightbox.show{display:flex;animation:fadeIn .3s}
.lightbox-inner{max-width:90vw;max-height:90vh;position:relative}
.lightbox-img{max-width:90vw;max-height:85vh;object-fit:contain;border:1px solid var(--border)}
.lightbox-caption{text-align:center;margin-top:16px;font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--text-b)}
.lightbox-close{position:absolute;top:-40px;right:0;font-size:24px;color:var(--text-m);cursor:pointer;transition:color .3s;background:none;border:none;font-family:inherit}
.lightbox-close:hover{color:var(--text-p)}

/* EXTRA */
.feed-tools{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:28px}
.feed-search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border);color:var(--text-p);font-family:'DM Mono',monospace;font-size:13px;padding:12px 16px;outline:none;transition:border-color .3s}
.feed-search:focus{border-color:var(--accent)}
.feed-search::placeholder{color:var(--text-m)}
.feed-filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:9px 16px;background:transparent;border:1px solid var(--border);color:var(--text-m);cursor:pointer;transition:.3s}
.filter-btn:hover{border-color:var(--accent);color:var(--text-p)}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.feed-empty{color:var(--text-m);font-size:13px;padding:20px 0}
.img-photo{width:100%;display:block}
.detail-img-wrap{margin:24px 0;border:1px solid var(--border);cursor:zoom-in;overflow:hidden}
.detail-img{width:100%;display:block}
.form-file{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text-m);font-family:'DM Mono',monospace;font-size:13px;padding:12px 16px;outline:none;cursor:pointer}
.form-file::-webkit-file-upload-button{background:transparent;border:1px solid var(--border);color:var(--text-b);font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.12em;padding:8px 14px;margin-right:12px;cursor:pointer;transition:.3s}
.form-file::-webkit-file-upload-button:hover{border-color:var(--accent);color:var(--accent)}
.img-hint{font-size:11px;color:var(--text-m);margin-top:8px;line-height:1.6}
.back-top{position:fixed;right:28px;bottom:28px;z-index:150;width:44px;height:44px;border:1px solid var(--border);background:rgba(20,20,18,.85);backdrop-filter:blur(8px);color:var(--text-b);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:.3s}
.back-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.back-top:hover{color:var(--accent);border-color:var(--accent)}

/* WATCHING */
.about-watching{margin:40px 0 0;padding:0 0 24px}
.watching-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.watching-card{display:flex;gap:16px;border:1px solid var(--border);padding:18px;transition:.3s;background:var(--surface)}
.watching-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.watching-cover{width:56px;height:56px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#1a2a1a,#0d1a2d);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent)}
.watching-body{display:flex;flex-direction:column;justify-content:center}
.watching-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--text-p)}

const Store = {
  _data: null,
  _init() {
    const saved = localStorage.getItem('straycat_data');
    this._data = saved ? JSON.parse(saved) : getDefaultData();
    if (!Array.isArray(this._data.watching)) this._data.watching = [];
    this._save();
  },
  _save() {
    const json = JSON.stringify(this._data);
    try { localStorage.setItem('straycat_data', json); }
    catch (err) {
      console.warn('[流浪猫] 存储失败，可能是数据超过浏览器容量限制(约5MB)。', err);
      alert('内容未能保存：本地存储空间不足，请删除部分大图后再试。');
    }
    if (json.length > 4500000) console.warn('[流浪猫] 数据接近浏览器存储上限，建议删减大图。');
  },
  getPosts() { return this._data.posts.sort((a, b) => b.date.localeCompare(a.date)); },
  getPost(id) { return this._data.posts.find(p => p.id === id); },
  addPost(post) { this._data.posts.unshift(post); this._save(); },
  deletePost(id) { this._data.posts = this._data.posts.filter(p => p.id !== id); this._save(); },
  getImages() { return this._data.images.sort((a, b) => b.date.localeCompare(a.date)); },
  getAlbums() { return this._data.albums; },
  getCollections() { return this._data.collections; },
  getCollectionPosts(name) { return this._data.posts.filter(p => p.collection === name).sort((a, b) => b.date.localeCompare(a.date)); },
  getAlbumImages(name) { return this._data.images.filter(i => i.album === name).sort((a, b) => b.date.localeCompare(a.date)); },
  getFriends() { return this._data.friends; },
  getWatching() { return this._data.watching || []; },
  addWatching(w) { this._data.watching.unshift(w); this._save(); },
  deleteWatching(i) { this._data.watching.splice(i, 1); this._save(); }
};

// 4. SIMPLE MARKDOWN
// ============================================================
function md(text) {
  if (!text) return '';
  let h = text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // image must be processed before link (since ![alt](src) also matches [..](..))
    .replace(/!\[(.+?)\]\((.+?)\)/g, '<img class="detail-img" src="$2" alt="$1">')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^---$/gm, '<hr>');
  // lists — ordered first so "1. x" doesn't collide with "- x"
  h = h.replace(/^ *(\d+)\. (.+)$/gm, '<li ol>$2</li>');
  h = h.replace(/^ *(?:-|\*) (.+)$/gm, '<li ul>$1</li>');
  h = h.replace(/((?:<li (?:ul|ol)>.*<\/li>\n?)+)/g, (m) => {
    const tag = /<li ol>/.test(m) ? 'ol' : 'ul';
    const inner = m.replace(/<li (?:ul|ol)>/g, '<li>').replace(/\n$/, '');
    return `<${tag}>${inner}</${tag}>`;
  });
  h = h.replace(/<li (?:ul|ol)>/g, '<li>');
  h = h.split('\n\n').map(b => {
    b = b.trim();
    if (!b) return '';
    if (/^<[a-z]/.test(b)) return b;
    return '<p>' + b.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  return h;
}

    const norm = p.content.replace(/[#*>`_\[\]]/g, '').slice(0, 400);
    html += `

function setFeedFilter(t) {

function applyFeedFilter() {
  const q = (document.getElementById('feedSearch') ? document.getElementById('feedSearch').value : '').toLowerCase().trim();
  document.querySelectorAll('#page-home .feed-item').forEach(item => {
    const show = (!feedFilter || item.dataset.type === feedFilter) &&
                 (!q || item.dataset.title.indexOf(q) > -1 || item.dataset.text.indexOf(q) > -1);
    item.style.display = show ? '' : 'none';

async function tryLogin() {
  const pwd = document.getElementById('adminPwd').value;
  const err = document.getElementById('gateError');
  if (!pwd) { if (err) err.textContent = '请输入密码'; return; }
  if (!(window.crypto && crypto.subtle)) {
    if (err) err.textContent = '当前环境不支持安全验证，请通过 HTTPS 或本地服务器打开后再登录。';
    return;
  }
  try {
    const ok = await verifyPassword(pwd, CONFIG.adminAuth.salt, CONFIG.adminAuth.hash, CONFIG.adminAuth.iter);
    if (ok) {
      sessionStorage.setItem('admin_logged_in', '1');
      showAdminPanel();
    } else {
      if (err) err.textContent = '密码错误';
    }
  } catch (e) {
    console.error('login failed', e);
    if (err) err.textContent = '登录验证失败';
  }
}

// Verify a password against a stored PBKDF2-SHA256 hash (salted). No plaintext is stored anywhere.
async function verifyPassword(pwd, saltHex, expectedHash, iter) {
  const enc = new TextEncoder();
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, keyMaterial, 256);
  const got = Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
  return got === expectedHash;
}

  document.getElementById('aImgRow').style.display = t === 'image' ? 'block' : 'none';
}

function publishPost() {
  const type = document.getElementById('aType').value;
  const title = document.getElementById('aTitle').value.trim();
  const content = document.getElementById('aContent').value.trim();
  let collection = document.getElementById('aCollection').value;

  if (!title) { document.getElementById('aSuccess').textContent = '请输入标题'; return; }
  if (!content) { document.getElementById('aSuccess').textContent = '请输入内容'; return; }

  if (collection === '__new__') {
    collection = document.getElementById('aNewCol').value.trim();
    if (!collection) { document.getElementById('aSuccess').textContent = '请输入新合集名称'; return; }
    // add new collection/album
    if (type === 'image') {
      Store._data.albums.push({ id: 'a' + Date.now(), name: collection, desc: '' });
    } else {
      Store._data.collections.push({ id: 'c' + Date.now(), name: collection, desc: '' });
    }
    Store._save();
  }

  const src = type === 'image' ? pendingImgSrc : null;
  const newPost = {
    id: id(),
    type,
    title,
    content,
    collection,
    date: new Date().toISOString().slice(0, 10)
  };

  if (type === 'image') {
    const caption = document.getElementById('aImgCaption').value.trim() || title;
    newPost.images = [{ caption, h: 200, src }];
    // Also add to images gallery
    Store._data.images.push({
      id: 'i' + Date.now(),
      caption,
      album: collection || '未分类',
      date: newPost.date,
      h: 180 + Math.floor(Math.random() * 140),
      grad: `linear-gradient(${100+Math.random()*160}deg, hsl(${Math.random()*360},15%,10%), hsl(${Math.random()*360},15%,8%))`,
      src
    });
    Store._save();
  }

  Store.addPost(newPost);

  // If GitHub is configured, also push to GitHub
  if (CONFIG.github.token && CONFIG.github.owner) {
    pushToGithub(newPost);
  }

  document.getElementById('aSuccess').textContent = '发布成功!';
  document.getElementById('aTitle').value = '';
  document.getElementById('aContent').value = '';
  pendingImgSrc = null;
  const pf = document.getElementById('aImgFile');
  if (pf) pf.value = '';
  const pp = document.getElementById('aImgPreview');
  if (pp) pp.innerHTML = '';
  setTimeout(() => { document.getElementById('aSuccess').textContent = ''; }, 3000);
  renderManageList();
}

// --- image upload (compress + base64) ---
let pendingImgSrc = null;
function onImgFileChange() {
  const file = document.getElementById('aImgFile').files[0];
  const preview = document.getElementById('aImgPreview');
  const hint = document.getElementById('aImgHint');
  if (!file) { pendingImgSrc = null; if (preview) preview.innerHTML = ''; return; }
  if (!/^image\//.test(file.type)) {
    if (hint) hint.textContent = '请选择图片文件';
    return;
  }
  if (hint) hint.textContent = '正在处理图片…';
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200, QUALITY = 0.72;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      pendingImgSrc = canvas.toDataURL('image/jpeg', QUALITY);
      if (preview) preview.innerHTML = `<img src="${pendingImgSrc}" alt="预览" style="max-width:240px;border:1px solid var(--border)">`;
      if (hint) hint.textContent = '已处理，发布后即可显示。';
      if (!document.getElementById('aImgCaption').value) {
        document.getElementById('aImgCaption').value = file.name.replace(/\.[^.]+$/, '');
      }
    };
    img.onerror = () => { if (hint) hint.textContent = '无法读取该图片'; };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderManageList() {

  el.innerHTML = posts.map(p => `

      <button class="btn btn-danger" onclick="deletePost('${p.id}')">删除</button>
    </li>`).join('') || '<li style="color:var(--text-m);padding:20px 0">暂无内容</li>';

}

  const token = document.getElementById('sToken').value.trim();
  const repo = document.getElementById('sRepo').value.trim();
  if (token) CONFIG.github.token = token;
  if (repo) {

  musicCfg.title = document.getElementById('sMusicTitle').value.trim();

function renderWatchingManage() {

  const list = Store.getWatching();

    <li class="watching-manage-item">
      <span class="watching-manage-name">${esc(w.title)}</span>

  if (!title) { showAdminMsg('wSuccess', '请输入番名'); return; }
  Store.addWatching({
    title,
    status: document.getElementById('wStatus').value.trim(),
    note: document.getElementById('wNote').value.trim()
  });

  document.getElementById('wStatus').value = '';
  document.getElementById('wNote').value = '';

function deleteWatching(i) {
  Store.deleteWatching(i);
  renderWatchingManage();
}

// ============================================================
// 8. GITHUB API
// ============================================================
async function pushToGithub(post) {
  const { token, owner, repo, branch } = CONFIG.github;
  if (!token || !owner || !repo) return;

  const path = `data/posts/${post.id}.json`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(post, null, 2))));

  try {
    await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `发布: ${post.title}`,
        content: content,
        branch: branch
      })
    });
  } catch (e) {
    console.error('GitHub push failed:', e);
  }
}

function openLightbox(imgId) {
  const img = Store.getImages().find(i => i.id === imgId);
  if (!img) return;
  const lb = document.getElementById('lightbox');
  const inner = img.src
    ? `<img class="lightbox-img" src="${img.src}" alt="${esc(img.caption)}">`
    : `<div style="width:60vw;max-width:800px;height:${Math.min(img.h * 1.5, 500)}px;background:${img.grad || 'var(--surface2)'};border:1px solid var(--border)"></div>`;
  document.getElementById('lightboxContent').innerHTML = `
    ${inner}
    <div class="lightbox-caption">${esc(img.caption)}</div>`;
  lb.classList.add('show');
}
function openLightboxBySrc(src) {
  if (!src) return;
  document.getElementById('lightboxContent').innerHTML = `
    <img class="lightbox-img" src="${src}" alt="预览">
    <div class="lightbox-caption">点击任意处关闭</div>`;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });

// ============================================================
// 10b. MUSIC (background audio)
// ============================================================
let musicCfg = { url: '', title: '' };
try {
  musicCfg = Object.assign({ url: '', title: '' }, JSON.parse(localStorage.getItem('straycat_music') || '{}'));
} catch (e) { musicCfg = { url: '', title: '' }; }
function saveMusic() { localStorage.setItem('straycat_music', JSON.stringify(musicCfg)); }

function initMusic() {
  const btn = document.getElementById('musicBtn');
  const a = document.getElementById('bgMusic');
  if (!btn || !a) return;
  if (musicCfg.url) a.src = musicCfg.url;
  if (musicCfg.title) btn.dataset.title = musicCfg.title;
  a.addEventListener('play', () => { btn.classList.add('playing'); hideMusicHint(); });
  a.addEventListener('pause', () => btn.classList.remove('playing'));
  a.addEventListener('ended', () => btn.classList.remove('playing'));
  a.addEventListener('error', () => { btn.classList.remove('playing'); showMusicHint('无法播放，请在后台「设置」填写背景音乐地址'); });
}

function toggleMusic() {
  const a = document.getElementById('bgMusic');
  if (!a) return;
  if (!a.src) a.src = musicCfg.url || 'music.mp3';
  if (a.paused) {
    a.play().then(() => {}).catch(() => showMusicHint('无法播放，请在后台「设置」填写背景音乐地址'));
  } else {
    a.pause();
  }
}
function showMusicHint(t) {
  const h = document.getElementById('musicHint');
  if (!h) return;
  h.textContent = t;
  h.classList.add('show');
  clearTimeout(h._t);
  h._t = setTimeout(() => h.classList.remove('show'), 3200);
}
function hideMusicHint() {
  const h = document.getElementById('musicHint');
  if (h) h.classList.remove('show');
}

// ============================================================
// 11. ROUTER
// ============================================================
function handleRoute() {
  const hash = location.hash || '#/';
  const parts = hash.slice(2).split('/');
  const section = parts[0] || '';
  const param = parts.slice(1).join('/');

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

  const titles = { home: '最新动态', articles: '文章', images: '图像', about: '关于', admin: '管理' };
  let title = titles[section];
  if (section === 'post') {
    const p = Store.getPost(param);
    if (p) title = p.title;
  }
  document.title = (title ? title + ' · ' : '') + CONFIG.siteName;

  switch (section) {
    case '':
    case 'home':
      document.getElementById('page-home').classList.add('active');
      document.querySelector('[data-page="home"]').classList.add('active');
      renderHome();
      break;
    case 'articles':
      document.getElementById('page-articles').classList.add('active');
      document.querySelector('[data-page="articles"]').classList.add('active');
      renderArticles();
      break;
    case 'images':
      document.getElementById('page-images').classList.add('active');
      document.querySelector('[data-page="images"]').classList.add('active');
      renderImages();
      break;
    case 'about':
      document.getElementById('page-about').classList.add('active');
      document.querySelector('[data-page="about"]').classList.add('active');
      renderAbout();
      break;
    case 'post':
      document.getElementById('page-detail').classList.add('active');
      renderDetail(param);
      break;
    case 'collection':
      document.getElementById('page-detail').classList.add('active');
      document.querySelector('[data-page="articles"]').classList.add('active');
      renderCollection(param);
      break;
    case 'album':
      document.getElementById('page-detail').classList.add('active');
      document.querySelector('[data-page="images"]').classList.add('active');
      renderAlbum(param);
      break;
    case 'admin':
      document.getElementById('page-admin').classList.add('active');
      renderAdmin();
      break;
    default:
      document.getElementById('page-home').classList.add('active');
      renderHome();
  }
  window.scrollTo(0, 0);
}
